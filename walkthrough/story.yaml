# The walkthrough, in order. walkthrough.py plays it; `--talk-track` prints the
# presenter's notes from it. Each beat is one command with:
#   caption  what the object or step is (on screen, line 1)
#   detail   why it matters, or what just changed (on screen, line 2)
#   say      the fuller talking point (talk track only), building on the step before
#   team     who does it: platform, ml, or both (shown as a badge)
# Paths are relative to walkthrough/manifests.

opening:
  title: Modelplane
  tagline: The open source control plane for AI inference
  problem:
    - Your GPUs span clouds and vendors, each cluster set up its own way.
    - Your ML teams want one endpoint.
  facts: [Open source, Apache 2.0, Built on Crossplane]
  works_with:
    - [PROVISIONS, AWS · Google Cloud · Azure · Nebius · Vultr · Civo]
    - [ADOPTS, any Kubernetes cluster you already run]
    - [GPUS, NVIDIA · AMD]
  note: >
    A simulated fleet, so no cluster is needed. The commands and the objects are
    Modelplane's own; the map on the right is what they do.

closing:
  title: Any model. Any engine. Any infrastructure. One API.
  recap:
    - provisioning: clusters and hardware declared once, across clouds
    - scheduling: models ask for devices; Modelplane finds where they fit
    - caching: weights staged once per cluster
    - routing: one name, OpenAI and Anthropic APIs, canary by label
    - autoscaling: kubectl scale or KEDA; callers keep one name
  ask: github.com/modelplaneai/modelplane

chapters:
  - id: fleet
    label: WALKTHROUGH · 1 OF 3
    title: Set up the inference fleet
    line: The fleet is two clouds, described in two files.
    beats:
      - id: classes
        team: platform
        command: cat platform/classes.yaml
        caption: "InferenceClass: a type of GPU node, described once."
        detail: Models never name hardware. They ask for devices like these.
        say: >
          Modelplane runs on a control cluster that needs no GPUs, and everything starts
          with the platform team. An InferenceClass describes one kind of GPU machine:
          here, an EKS p5en with eight H200s at 141GB each, and a bring-your-own node with
          eight B200s. It's written once. ML teams never name a machine type; they ask
          for devices, and these are the devices they can get.
      - id: cluster-yaml
        team: platform
        command: cat platform/clusters.yaml
        caption: "InferenceCluster: one Kubernetes cluster in the fleet."
        detail: It says which class its nodes are and how many. Modelplane can create it or adopt yours.
        say: >
          An InferenceCluster is one cluster in the fleet. Its node pool points at a class,
          so a node is "an h200-8x", and says how many nodes there are. The AWS one has
          source EKS, so Modelplane creates it. The CoreWeave one has source Existing: you
          already run it, and hand it over with a kubeconfig and a storage class for model
          weights.
      - id: clusters
        team: platform
        command: kubectl apply -f platform/
        caption: Apply both, and Modelplane provisions the fleet.
        detail: It creates the EKS cluster and installs its serving stack on both clusters.
        say: >
          That's the whole job for the platform team. Applying the files is all it takes:
          Modelplane provisions the EKS cluster and its pool, and installs its serving
          stack, including a gateway, on both clusters. Watch the provisioning chip and the
          two clusters appear.

  - id: model
    label: WALKTHROUGH · 2 OF 3
    title: Deploy a model
    line: The model asks for what it needs. Modelplane finds where it fits.
    beats:
      - id: deployment
        team: ml
        command: cat model/cache.yaml model/glm.yaml
        caption: "ModelCache names the weights; ModelDeployment is the ML team's side."
        detail: An image, engine flags and a request for 8 GPUs with 140Gi each. No cloud, no node.
        say: >
          Now the ML team, with two objects. A ModelCache names the weights to fetch
          from Hugging Face. A ModelDeployment is like a Kubernetes Deployment, but its
          replicas land on clusters instead of nodes. It references the cache, names the
          engine, vLLM here, and makes a request written against device attributes: eight
          GPUs with at least 140Gi each, on a cluster labelled geo=us. It says nothing
          about AWS, CoreWeave or machine types.
      - id: deploy
        team: ml
        command: kubectl apply -f model/
        caption: "ModelCache stages the weights, then the scheduler places replicas."
        detail: Weights are fetched once per cluster. Replicas spread across clusters before packing.
        say: >
          Two things happen. The ModelCache pulls the weights once into each cluster's
          shared storage, so pods don't download 700 gigabytes on every start; that's the
          caching chip. Then the scheduler matches the request against the classes, and
          places the two replicas on different clusters first; that's scheduling. Watch a
          whole node of each cluster fill.
      - id: replicas
        team: ml
        command: kubectl get modelreplicas -n coding-team
        caption: "ModelReplica: one serving copy, pinned to a cluster."
        detail: Like a Pod pinned to a node. Nobody picked these clusters.
        say: >
          Each replica is a ModelReplica, pinned to one cluster the way a Pod is pinned to
          a node. One on AWS, one on CoreWeave, and nobody chose. SERVING says each is up.
      - id: endpoints
        team: ml
        command: >-
          kubectl get modelendpoints -n coding-team
          -o custom-columns='NAME:.metadata.name,MODEL:.spec.model,CLUSTER:.metadata.labels.modelplane\.ai/cluster,APP:.metadata.labels.app'
        caption: "ModelEndpoint: where a serving replica can be reached."
        detail: Each carries its deployment's labels. The next chapter routes by them.
        say: >
          Every serving replica also gets a ModelEndpoint: an address for it, labelled with
          its cluster and with the deployment's own labels, like app=glm. Those labels are
          what the next chapter routes on.

  - id: scale
    label: WALKTHROUGH · 3 OF 3
    title: Scale the fleet
    line: The fleet changed. The name didn't.
    beats:
      - id: service-yaml
        team: both
        command: cat routing/service.yaml routing/gateway-us.yaml
        caption: "ModelService names the model; InferenceGateway is the front door."
        detail: The service selects endpoints labelled app=glm. The gateway serves services labelled exposure=public.
        say: >
          A ModelService is to endpoints what a Kubernetes Service is to Pods: it selects
          everything labelled app=glm and gives it one name, coding-team/glm, its namespace
          and name. An InferenceGateway is the front door. It runs on a cluster you name,
          checks an API key per caller, and serves every ModelService whose labels match
          its serviceSelector.
      - id: route
        team: both
        command: kubectl apply -f routing/
        caption: Apply them, and the model has an address.
        detail: The gateway serves coding-team/glm on the OpenAI and Anthropic APIs.
        say: >
          Applying them lights the routing chip: the gateway comes up on the AWS cluster
          and publishes coding-team/glm on the OpenAI API at /v1 and Anthropic's Messages
          API at /anthropic/v1.
      - id: anthropic
        team: ml
        command: >-
          curl $GW_US/anthropic/v1/messages -H "x-api-key: $BOB_KEY" -H "anthropic-version: 2023-06-01"
          -d '{"model":"coding-team/glm","max_tokens":256,"messages":[{"role":"user","content":"hello"}]}'
        caption: "One request, by name. The response says which deployment answered."
        detail: "For Claude Code, set ANTHROPIC_BASE_URL=$GW_US/anthropic."
        say: >
          A caller only knows the name. This is the Anthropic Messages API, so Claude Code
          works by pointing ANTHROPIC_BASE_URL at the gateway; OpenAI SDKs use /v1 the same
          way. The response names the deployment that served it, and the map marks the
          replica.
      - id: scale-up
        team: ml
        command: kubectl scale md glm -n coding-team --replicas 3
        caption: Scale it like any Deployment.
        detail: The new replica goes where there's room. KEDA can drive the same knob.
        say: >
          More traffic: kubectl scale, the same scale subresource any Deployment has, so
          KEDA can drive it too. That's autoscaling. Each cluster already has one replica,
          so the third goes to the cluster with more room.
      - id: add-cluster
        team: platform
        command: kubectl apply -f grow/vultr-ams.yaml
        caption: Grow the fleet with one more InferenceCluster.
        detail: Europe, on AMD, with its own gateway. The weights stage there by themselves.
        say: >
          Growing the fleet is the same move as chapter one: a class for AMD MI325X nodes,
          an InferenceCluster in Amsterdam, and a gateway there. The cache from chapter two
          stages onto it without anyone asking.
      - id: add-deployment
        team: ml
        command: kubectl apply -f grow/glm-eu.yaml
        caption: The same model on AMD is a second ModelDeployment.
        detail: A ROCm image, an AMD device request, and app=glm, so the service picks it up unchanged.
        say: >
          AMD needs a ROCm build of vLLM, so this is its own ModelDeployment, pinned to
          Europe and asking for AMD devices. It carries app=glm, so the ModelService from a
          minute ago includes it. Nothing on the routing side changed.
      - id: same-name
        team: ml
        command: >-
          for i in $(seq 8); do curl -s $GW_US/v1/chat/completions
          -H "Authorization: Bearer $ALICE_KEY" -d '{"model":"coding-team/glm","messages":[]}' | jq -r .model; done
        caption: The same request, eight times, on the OpenAI API.
        detail: Answered by two deployments, on three clouds and two GPU vendors.
        say: >
          Same name, same request, now on the OpenAI API. The answers come from both
          deployments, across AWS, CoreWeave and Vultr, NVIDIA and AMD. The fleet changed
          three times; the caller's code didn't.

  - id: day2
    label: ENCORE · DAY 2
    title: Operate the fleet
    encore: true
    line: Measure, try a new engine, promote on evidence. Drain a cluster like a node.
    beats:
      - id: telemetry-yaml
        team: platform
        command: cat encore/telemetry.yaml
        caption: "TelemetryDestination: where the fleet's metrics go."
        detail: One object, one sink. Here, your Prometheus.
        say: >
          Day two starts with measuring, before changing anything. A TelemetryDestination
          says where the fleet's metrics go: a list of sinks, each one an OpenTelemetry
          exporter. This one writes to your Prometheus; an OTLP endpoint works the same way.
      - id: telemetry
        team: platform
        command: kubectl apply -f encore/telemetry.yaml
        caption: Apply it, and a collector starts on every cluster.
        detail: Every engine's metrics get the same modelplane_* names, labelled by deployment and cluster.
        say: >
          Applying it starts a collector on every cluster in the fleet. Each one scrapes the
          engines there and renames their metrics to the same modelplane_* names, labelled
          with deployment, cluster and replica. That's what makes the next comparison
          possible: two different engines, measured on the same terms.
      - id: engine-yaml
        team: ml
        command: cat encore/glm-sglang.yaml
        caption: Trying a new engine is a new ModelDeployment.
        detail: SGLang this time, the same device request, labelled env=canary. The vLLM one keeps running.
        say: >
          The ML team wants to try SGLang, whose prefix cache suits agents that resend
          the same long context every turn. They don't touch the running deployment; they
          add a second one beside it, with the same device request, labelled env=canary so
          it gets no production traffic until the service says so.
      - id: canary-yaml
        team: ml
        command: diff routing/service.yaml encore/service-canary.yaml
        caption: The same service, split by label.
        detail: env=prod at weight 90, env=canary at weight 10, under the same name.
        say: >
          To send it a little traffic, the ModelService gets two entries instead of one:
          endpoints labelled env=prod at weight 90, and env=canary at weight 10. The name
          stays coding-team/glm.
      - id: canary
        team: ml
        command: kubectl apply -f encore/glm-sglang.yaml -f encore/service-canary.yaml
        caption: Apply both. The canary deploys and gets its share.
        detail: Its two replicas spread across clusters. Callers still ask for coding-team/glm.
        say: >
          Apply the new deployment and the new service together. The SGLang replicas go
          wherever there's room, spread across clusters like before, and as soon as they
          serve, the canary entry routes to them.
      - id: canary-traffic
        team: ml
        command: >-
          for i in $(seq 10); do curl -s $GW_US/v1/chat/completions
          -H "Authorization: Bearer $ALICE_KEY" -d '{"model":"coding-team/glm","messages":[]}' | jq -r .model; done
        caption: Ten requests, same name.
        detail: About one in ten reaches SGLang.
        say: >
          About one request in ten lands on the SGLang deployment, and the response says
          so. Now there's real traffic on both engines to compare.
      - id: compare
        team: ml
        command: >-
          curl -s $PROM/api/v1/query --data-urlencode
          'query=sum by (deployment) (rate(modelplane_prefix_cache_hits_total[10m]))
          / sum by (deployment) (rate(modelplane_prefix_cache_lookups_total[10m]))'
          | jq -r '.data.result[] | "\(.metric.deployment) \(.value[1])"'
        caption: Compare the engines on the same metric.
        detail: Prefix-cache hit rate by deployment. Same name, same labels, whichever engine reports it.
        say: >
          One query in your Prometheus: prefix-cache hit rate, by deployment. vLLM and
          SGLang name this counter differently, but the collector maps both to
          modelplane_prefix_cache_hits_total, so this is a like-for-like comparison. The
          numbers here are the simulator's; the point is that the question takes one query.
      - id: promote
        team: ml
        command: >-
          kubectl patch md glm-sglang -n coding-team --type merge
          -p '{"spec":{"template":{"metadata":{"labels":{"env":"prod"}}}}}'
        caption: Promote it by changing one label.
        detail: Its endpoints now carry env=prod, so they get production traffic.
        say: >
          The evidence says go. Promotion is a label: change the deployment's env label to
          prod, its endpoints carry the new label, and the prod entry of the service now
          includes them.
      - id: retire
        team: ml
        command: kubectl scale md glm -n coding-team --replicas 0
        caption: Retire the US vLLM deployment.
        detail: Its GPUs free up. Europe's AMD deployment is its own, so it keeps serving on vLLM.
        say: >
          Scale the US vLLM deployment to zero and its GPUs come back to the pool. Notice
          Amsterdam keeps serving: glm-eu is a separate deployment, a ROCm build of vLLM on
          AMD, and it's still env=prod. The canary was an NVIDIA image, so each hardware
          type runs the engine that suits it, under one name. Rolling back is the same two
          commands the other way round.
      - id: drain
        team: platform
        command: >-
          kubectl patch inferencecluster coreweave-us-west --type merge
          -p '{"spec":{"taints":[{"key":"modelplane.ai/maintenance","effect":"NoExecute"}]}}'
        caption: Drain a whole cluster with a taint.
        detail: Each replica there is deleted and a new one placed where it still fits.
        say: >
          Last, CoreWeave needs maintenance. A NoExecute taint on the InferenceCluster works
          like draining a node: Modelplane deletes each replica there and places a new one
          on a cluster that fits. Remove the taint and the cluster takes work again; nothing
          moves back by itself.
