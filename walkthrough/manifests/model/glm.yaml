# The coding team's model. It asks for eight GPUs with at least 140Gi each on a
# US cluster; it doesn't say which cloud, machine type or node.
apiVersion: modelplane.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: glm
  namespace: coding-team
spec:
  replicas: 2
  template:
    metadata:
      labels: { app: glm, env: prod }
    spec:
      clusterSelector: { matchLabels: { geo: us } }
      modelCacheRef: { name: glm-5-3 }
      engines:
      - name: vllm
        members:
        - role: Standalone
          nodeSelector:
            devices:
            - name: gpu
              count: 8
              selectors:
              - cel: device.capacity["gpu.nvidia.com"].memory.compareTo(quantity("140Gi")) >= 0
          template:
            spec:
              containers:
              - name: engine
                image: vllm/vllm-openai:v0.23.0
                args:
                - --model=zai-org/GLM-5.3
                - --served-model-name=$(MODELPLANE_SERVED_MODEL_NAME)
                - --tensor-parallel-size=8
                - --trust-remote-code
                - --enable-auto-tool-choice
                - --tool-call-parser=glm47
                - --reasoning-parser=glm47
                - --kv-cache-dtype=fp8
                - --enable-prefix-caching
                - --port=8000
