# The same model on SGLang. The image, command and engine flags change; it
# starts labelled env: canary, so production traffic doesn't reach it yet.
apiVersion: modelplane.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: glm-sglang
  namespace: coding-team
spec:
  replicas: 2
  template:
    metadata:
      labels: { app: glm, env: canary }
    spec:
      clusterSelector: { matchLabels: { geo: us } }
      modelCacheRef: { name: glm-5-3 }
      engines:
      - name: sglang
        members:
        - role: Standalone
          nodeSelector:
            devices:
            - name: gpu
              count: 8
              selectors:
              - cel: device.capacity["gpu.nvidia.com"].memory.compareTo(quantity("140Gi")) >= 0
          template:
            metadata:
              labels: { llm-d.ai/engine-type: sglang }   # so the endpoint picker reads SGLang's metrics
            spec:
              containers:
              - name: engine
                image: lmsysorg/sglang:v0.5.12.post1-cu129
                command: ["python3", "-m", "sglang.launch_server"]
                args:
                - --model-path=zai-org/GLM-5.3
                - --served-model-name=$(MODELPLANE_SERVED_MODEL_NAME)
                - --tp-size=8
                - --trust-remote-code
                - --tool-call-parser=glm45
                - --reasoning-parser=glm45
                - --host=0.0.0.0
                - --port=8000
                - --enable-metrics
